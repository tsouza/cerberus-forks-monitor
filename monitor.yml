# cerberus-forks-monitor — declarative config for the daily upstream sync.
#
# Each entry describes one upstream → fork pairing. The monitor.sh script
# reads this file, computes whether any commit landing in upstream/main
# since the last tag touched the watched subtree, and rebases + retags the
# fork if so. See README.md for the full flow.
#
# - relevant_paths : passed directly to `git log -- <paths>`. Use directory
#                    paths to match anything under them; use specific file
#                    paths when you only care about one file.
# - tag_prefix     : the semver prefix for new tags. Must already exist
#                    on the fork (the baseline v0.0.1-cerberus-* tags were
#                    minted when the fork was created).
# - track          : optional, `main` (the default) or `release`. `main`
#                    rebases onto upstream/main when a relevant path changed
#                    and bumps the tag's patch. `release` rebases onto the
#                    newest stable upstream release tag (vX.Y.Z) whenever a
#                    newer one exists, and tags it with that release's Go
#                    module number (v3.15.0 -> v0.315.0-cerberus-parser).
#
# An entry belongs here only while cerberus's go.mod routes that dependency
# through the fork. A fork cerberus no longer consumes has nothing to keep in
# sync, and its cerberus-* branch drifts from upstream until the daily rebase
# conflicts forever — which is red every morning for a dependency nobody
# links. `grafana/loki` and `grafana/tempo` were watched here until cerberus
# replaced both parsers with its own clean-room implementations
# (internal/logql/lsyntax, internal/traceql/ast); the go.mod replaces are
# gone, so the entries are too. Check go.mod before adding one back.

deps:
  - name: prometheus
    upstream: prometheus/prometheus
    fork: tsouza/prometheus
    fork_branch: cerberus-parser
    tag_prefix: v0
    # cerberus pins its reference Prometheus server to the release this fork
    # carries (test/regression/fork_version_skew_test.go), so the fork
    # follows releases, never unreleased upstream/main.
    track: release
    test_subtrees:
      - ./promql/parser/...
      - ./model/labels/...
      - ./model/histogram/...
    relevant_paths:
      - promql/parser
      - model/labels
      - model/histogram
      - util/annotations
      - storage/storage.go
      - tsdb/chunkenc
      - tsdb/chunks/chunks.go

  - name: otelc
    upstream: open-telemetry/opentelemetry-collector-contrib
    fork: tsouza/opentelemetry-collector-contrib
    fork_branch: cerberus-ddl
    tag_prefix: v0
    # collector-contrib uses a per-subdirectory module layout; test inside
    # the clickhouseexporter module. The cerberus-ddl branch hoists
    # internal/sqltemplates to ./sqltemplates, so only the hoisted path
    # exists on the fork branch (relevant_paths still watches both the
    # upstream-internal and hoisted locations).
    #
    # The whole module, not just ./sqltemplates/... — that package holds only
    # .sql files and an embed.go, so `go test` on it reports ok without
    # compiling a single consumer. The hoist is a MOVE: what breaks when
    # upstream changes is an importer of the old path, and nothing under
    # ./sqltemplates/... imports anything. Upstream adding exporter_profiles.go
    # (which imports the pre-hoist internal/sqltemplates path) broke the build
    # while this gate reported green. Testing the module compiles every
    # importer, which is the only thing that can catch it.
    test_subtrees:
      - ./...
    test_workdir: exporter/clickhouseexporter
    # Per-submodule tags are minted in addition to the toplevel tag. Listed
    # paths each get a `<path>/v<TAG>` reference pointing at the rebased SHA.
    submodule_tag_paths:
      - exporter/clickhouseexporter
      - internal/coreinternal
      - pkg/core/xidutils
      - pkg/translator/jaeger
    relevant_paths:
      - exporter/clickhouseexporter/sqltemplates
      - exporter/clickhouseexporter/internal/sqltemplates
